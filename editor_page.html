<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Редактор документа</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e5e7eb; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { margin: 0; color: #38bdf8; font-size: 24px; }
    .controls { display: flex; gap: 15px; align-items: center; background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
    .controls input[type="number"] { width: 60px; padding: 5px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    .btn { background: #38bdf8; color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #7dd3fc; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #f87171; }
    
    .grid { display: flex; flex-wrap: wrap; gap: 16px; }
    .page-card { 
      background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px;
      width: 150px; display: flex; flex-direction: column; align-items: center; cursor: grab;
      position: relative;
    }
    .page-card.dragging { opacity: 0.5; }
    .page-card.deleted { opacity: 0.3; filter: grayscale(100%); }
    .page-card img { width: 100%; height: 180px; object-fit: contain; background: #fff; border-radius: 4px; margin-bottom: 10px; pointer-events: none; }
    .page-card .page-num { font-size: 14px; font-weight: bold; color: #94a3b8; }
    .page-card .delete-btn {
      position: absolute; top: -8px; right: -8px; background: #ef4444; color: #fff;
      border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .page-card .delete-btn:hover { background: #f87171; }
    
    .page-card.drag-over-left { border-left: 3px solid #38bdf8; margin-left: -2px; }
    .page-card.drag-over-right { border-right: 3px solid #38bdf8; margin-right: -2px; }
  </style>
</head>
<body>

<div class="header">
  <h1>Редактор документа (Предпросмотр)</h1>
  <button class="btn" id="btn-finalize">💾 Сохранить и Скачать PDF</button>
</div>

<div class="controls">
  <label><input type="checkbox" id="chk-numbering"> Добавить нумерацию</label>
  <div id="num-options" style="display: none; gap: 10px; align-items: center;">
    <span>с страницы: <input type="number" id="num-from" value="1" min="1"></span>
    <span>с числа: <input type="number" id="num-start" value="1" min="1"></span>
  </div>
  <button class="btn btn-danger" id="btn-reset" style="margin-left: auto;">Сбросить изменения</button>
</div>

<div class="grid" id="grid">
  <!-- Pages will be injected here -->
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const draftId = urlParams.get('draft_id');
  const pageCount = parseInt(urlParams.get('count') || '0');
  
  if (urlParams.get('num') === '1') {
    document.getElementById('chk-numbering').checked = true;
    document.getElementById('num-options').style.display = 'flex';
  }
  if (urlParams.has('num_from')) document.getElementById('num-from').value = urlParams.get('num_from');
  if (urlParams.has('num_start')) document.getElementById('num-start').value = urlParams.get('num_start');
  
  if (!draftId || !pageCount) {
    alert("Ошибка загрузки черновика");
  }

  const grid = document.getElementById('grid');
  let deletedPages = new Set();
  
  // Render pages
  for (let i = 1; i <= pageCount; i++) {
    const card = document.createElement('div');
    card.className = 'page-card';
    card.draggable = true;
    card.dataset.page = i;
    
    // Fetch image from the dedicated draft preview endpoint
    card.innerHTML = `
      <button class="delete-btn" title="Удалить страницу">✕</button>
      <img src="/api/draft/${draftId}/preview?page=${i}" alt="Page ${i}" loading="lazy" />
      <div class="page-num">Стр. ${i}</div>
    `;
    
    card.querySelector('.delete-btn').addEventListener('click', () => {
      if (deletedPages.has(i)) {
        deletedPages.delete(i);
        card.classList.remove('deleted');
      } else {
        deletedPages.add(i);
        card.classList.add('deleted');
      }
    });
    
    // Drag and Drop
    card.addEventListener('dragstart', (e) => {
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      // Workaround for Firefox
      e.dataTransfer.setData('text/plain', i); 
    });
    
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      grid.querySelectorAll('.page-card').forEach(c => c.classList.remove('drag-over', 'drag-over-left', 'drag-over-right'));
    });
    
    card.addEventListener('dragover', (e) => {
      e.preventDefault(); // Necessary to allow dropping
      const draggingCard = document.querySelector('.dragging');
      if (!draggingCard || draggingCard === card) return;
      
      const box = card.getBoundingClientRect();
      const offset = e.clientX - box.left - box.width / 2;
      
      card.classList.remove('drag-over-left', 'drag-over-right');
      if (offset < 0) {
        card.classList.add('drag-over-left');
      } else {
        card.classList.add('drag-over-right');
      }
    });

    card.addEventListener('dragleave', () => {
      card.classList.remove('drag-over-left', 'drag-over-right');
    });

    card.addEventListener('drop', (e) => {
      e.preventDefault();
      const draggingCard = document.querySelector('.dragging');
      card.classList.remove('drag-over-left', 'drag-over-right');
      
      if (!draggingCard || draggingCard === card) return;
      
      const box = card.getBoundingClientRect();
      const offset = e.clientX - box.left - box.width / 2;
      
      if (offset < 0) {
        grid.insertBefore(draggingCard, card);
      } else {
        grid.insertBefore(draggingCard, card.nextSibling);
      }
    });

    grid.appendChild(card);
  }
  
  // Drag over grid (fallback for empty areas)
  grid.addEventListener('dragover', (e) => {
    e.preventDefault();
  });

  
  // Numbering toggle
  document.getElementById('chk-numbering').addEventListener('change', (e) => {
    document.getElementById('num-options').style.display = e.target.checked ? 'flex' : 'none';
  });
  
  // Reset
  document.getElementById('btn-reset').addEventListener('click', () => {
    window.location.reload();
  });
  
  // Finalize
  document.getElementById('btn-finalize').addEventListener('click', async () => {
    const pageOrder = [...document.querySelectorAll('.page-card')].map(c => parseInt(c.dataset.page));
    
    const req = {
      page_order: pageOrder,
      deleted_pages: Array.from(deletedPages),
      number_pages: document.getElementById('chk-numbering').checked,
      numbering_from_page: parseInt(document.getElementById('num-from').value),
      numbering_start: parseInt(document.getElementById('num-start').value),
    };
    
    const btn = document.getElementById('btn-finalize');
    btn.disabled = true;
    btn.innerText = '⏳ Сборка...';
    
    try {
      const res = await fetch(`/api/draft/${draftId}/finalize`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(req)
      });
      
      if (!res.ok) throw new Error(await res.text());
      
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'сборка.pdf';
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
    } catch (e) {
      alert("Ошибка: " + e.message);
    } finally {
      btn.disabled = false;
      btn.innerText = '💾 Сохранить и Скачать PDF';
    }
  });
</script>
</body>
</html>
